---
version: "3.9"
services:
  pxls-database:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: "pxls"
      POSTGRES_PASSWORD: "pxls"
      POSTGRES_DB: "pxls"
    command: postgres -c 'max_connections=1000'
    volumes:
      - ./backup/database:/var/lib/postgresql/data
    ports:
      - "15432:5432"
